name: semrember
version: 1.0.0

description: |
  Compressed associative memory: byte n-gram TF-IDF fused with optional
  static embeddings, a regularized ridge writer, and an exact kernel-dual
  writer with replacement and incremental insertion.
  Ships as an embeddable library, a CLI and a Redis-style HTTP/JSON service.

authors:
  - semrember contributors

license: MIT

crystal: ">= 1.12.0"

dependencies:
  kemal:
    github: kemalcr/kemal
    version: 1.15.0

targets:
  semrember:
    main: src/cli.cr
  semrember-server:
    main: src/server_cli.cr

# The memory engine and CLI need no shards. The HTTP service uses Kemal.
# The default build links system libraries; static linking is optional.
