[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semrember-client"
version = "1.0.0"
description = "Standard-library Python client for the Semrember HTTP service"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/sethuiyer/semrember"
Documentation = "https://github.com/sethuiyer/semrember/blob/main/API.md"

[tool.setuptools]
py-modules = ["semrember_client"]
