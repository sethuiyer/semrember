name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - name: Build
        run: make all fetch-model
      - name: Test
        run: make test
      - name: HTTP smoke test
        run: make smoke
